name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tests drive a real LibreOffice through UNO. There is no mock: an
      # extension that registers but does not dispatch, or a page number that
      # is wrong, only shows up against the actual application.
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno

      - name: Version
        run: soffice --version

      - name: Build the extension
        run: python3 build.py

      - name: Run the test suite
        run: tests/run.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 build.py
      - name: Check the package has what LibreOffice needs
        run: |
          python3 - <<'PY'
          import sys, zipfile
          required = {"META-INF/manifest.xml", "description.xml",
                      "Addons.xcu", "ProtocolHandler.xcu", "toa.py"}
          names = set(zipfile.ZipFile("dist/table-of-authorities.oxt").namelist())
          missing = required - names
          print("contents:", sorted(names))
          if missing:
              sys.exit(f"missing from the .oxt: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: table-of-authorities.oxt
          path: dist/table-of-authorities.oxt
